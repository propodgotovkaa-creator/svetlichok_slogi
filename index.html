<!doctype html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Лови светлячков</title>
<style>
:root{color-scheme:dark;font-family:Arial,sans-serif;color:#fff4d8}*{box-sizing:border-box}body{margin:0;background:#0c1e2a;overflow:hidden}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:5px solid #fff1af;outline-offset:5px}button:disabled{cursor:default}#viewport{width:100vw;height:100dvh;display:grid;place-items:center;overflow:hidden}#frame{position:relative}#game{width:1920px;height:1080px;position:absolute;left:0;top:0;transform-origin:top left;overflow:hidden;background:#193d51 url('fon.png') center/cover no-repeat}#game:before{content:'';position:absolute;inset:0;background:linear-gradient(#0a203944,transparent 45%,#091f2733);pointer-events:none}.screen{position:absolute;inset:0} [hidden]{display:none!important} .eyebrow{text-transform:uppercase;letter-spacing:6px;color:#ddc985;font-size:20px}h1,h2,p{margin:0}h1{font:normal 76px Georgia,serif;letter-spacing:1px;margin:14px 0 12px}h2{font:normal 58px Georgia,serif}.sub{font-size:25px;color:#bfd7d8;line-height:1.5}.panel{border:1px solid #9cbba84d;background:linear-gradient(145deg,#143644f2,#102a37f5);box-shadow:0 28px 90px #03152166;border-radius:42px}.menu-card{position:absolute;inset:62px 255px;padding:42px 65px;text-align:center}.settings{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;text-align:left;margin:32px 0 23px}.group{padding:24px;background:#6d9a9b0d;border:1px solid #a6c5be22;border-radius:24px}.group-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.group h3{font-size:28px;font-weight:500;margin:0}.limit{font-size:19px;color:#b4c7c7}.letters{display:flex;flex-wrap:wrap;gap:12px}.letter{width:74px;height:69px;border-radius:16px;border:1px solid #92b5ae66;background:#274a56;color:#f9f3dc;font-size:32px;font-weight:600;transition:background .15s,transform .15s}.letter:hover{background:#365e67;transform:translateY(-2px)}.letter[aria-pressed=true]{background:linear-gradient(145deg,#fae1a0,#d9b964);color:#263f42;border-color:#fff1b8;box-shadow:0 3px 15px #e9bf4830}.preview-label{font-size:21px;color:#c5d6d2;margin-bottom:12px}.syllables{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;min-height:47px;max-width:1130px;margin:auto}.chip{font-size:22px;letter-spacing:2px;border-radius:11px;padding:9px 12px;background:#ffffff0c;color:#f8e5ad}.message{height:31px;font-size:20px;color:#f3d393;margin:12px 0}.primary{font-size:28px;font-weight:600;color:#263e3e;background:linear-gradient(#ffe6a7,#dabc74);border:1px solid #fff1ba;border-radius:22px;padding:21px 75px;box-shadow:0 8px 30px #e1b54b25;transition:filter .2s}.primary:hover{filter:brightness(1.08)}.primary:disabled{opacity:.45}.ghost{color:#f6eacf;border:1px solid #aec5bc66;background:#163c49da;border-radius:18px;padding:17px 26px;font-size:24px}.hud{position:absolute;top:43px;left:64px;right:64px;display:flex;align-items:center;justify-content:space-between}.hud-title{font:40px Georgia,serif;text-shadow:0 2px 8px #001d2c}.hud-center{text-align:center;position:absolute;left:50%;transform:translateX(-50%);top:0}.progress{font-size:29px;color:#fff0c4}.track{height:7px;width:230px;border-radius:8px;background:#ffffff26;margin-top:14px;overflow:hidden}.track span{display:block;width:0;height:100%;background:#fce1a0;transition:width .4s}.instruction{position:absolute;top:146px;width:100%;text-align:center;font-size:27px;color:#e0e6cf;text-shadow:0 2px 8px #0b2839}.bug{position:absolute;width:290px;height:307px;border:0;padding:0;background:transparent;color:inherit;will-change:transform;transform-origin:center;filter:drop-shadow(0 0 15px #ffdc6230)}.bug svg{width:100%;height:100%;overflow:visible;display:block}.bug:focus-visible{border-radius:50%;outline-width:3px}.wing-left{transform-origin:502px 568px;animation:wing-left 1.5s ease-in-out infinite}.wing-right{transform-origin:727px 584px;animation:wing-right 1.5s ease-in-out infinite}@keyframes wing-left{0%,100%{transform:rotate(-2deg) scaleX(1)}50%{transform:rotate(3deg) scaleX(.86)}}@keyframes wing-right{0%,100%{transform:rotate(2deg) scaleX(1)}50%{transform:rotate(-3deg) scaleX(.86)}}.bug text{font:bold 155px Arial,sans-serif;fill:#3b3225;letter-spacing:3px}.bug.catching{filter:drop-shadow(0 0 35px #ffe0a5) brightness(1.15)}.jar-area{position:absolute;left:807px;top:763px;width:306px;height:306px;pointer-events:none}.jar-glow{position:absolute;inset:36px 22px 8px;border-radius:50%;background:radial-gradient(ellipse,#ffe394aa,transparent 66%);opacity:0;transition:opacity .6s,transform 1.4s;filter:blur(12px)}.jar{position:absolute;width:100%;height:100%;z-index:3}.lid{position:absolute;width:190px;left:57px;top:-43px;z-index:4;transform:rotate(-8deg);transition:transform 1.4s ease,top 1.4s ease,opacity 1.4s}.jar-area.closed .lid{top:18px;transform:rotate(0deg)}.jar-area.releasing .lid{top:-135px;transform:rotate(22deg);opacity:0}.jar-area.releasing .jar-glow{transform:scale(1.9)}.jar-lights{position:absolute;inset:0;z-index:2}.light{position:absolute;width:10px;height:10px;border-radius:50%;background:#fff6bd;box-shadow:0 0 14px 5px #ffd65b99;animation:twinkle 2s ease-in-out infinite alternate}@keyframes twinkle{to{opacity:.4;transform:translateY(-5px)}}.particle{position:absolute;width:9px;height:9px;background:#ffe5a0;border-radius:50%;pointer-events:none;box-shadow:0 0 13px #ffd85f;animation:spark .8s ease-out forwards;z-index:10}@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}#ending{z-index:20;background:#061c2a66;display:grid;place-items:center;backdrop-filter:blur(5px)}.end-card{width:850px;padding:58px 50px;text-align:center}.end-card .eyebrow{margin-bottom:18px}.end-card .sub{margin:24px 0 35px}.end-actions{display:flex;justify-content:center;gap:18px}.end-actions .primary{padding:20px 35px}.end-actions .ghost{padding:20px 28px}#asset-error{position:absolute;bottom:12px;left:20%;right:20%;text-align:center;color:#ffdeba;background:#263b43;padding:10px;border-radius:12px;font-size:19px;z-index:30}@media(prefers-reduced-motion:reduce){.wing-left,.wing-right,.light{animation:none}.particle{animation-duration:.01s}}
</style></head>
<body><div id="viewport"><div id="frame"><main id="game">
<svg width="0" height="0" aria-hidden="true" style="position:absolute"><defs>
<path id="leftShape" d="M 0,180 H 390 L 448,399 Q 427,489 499,558 L 486,588 L 472,615 L 457,638 L 469,659 L 483,676 L 469,695 L 437,719 L 403,749 L 375,777 H 0 Z"/>
<path id="rightShape" d="M 1232,215 H 885 L 783,402 Q 802,502 728,565 L 724,600 L 740,629 L 754,646 L 773,665 L 766,687 L 794,715 L 817,742 L 837,796 H 1232 Z"/>
<clipPath id="leftClip"><use href="#leftShape"/></clipPath><clipPath id="rightClip"><use href="#rightShape"/></clipPath>
<mask id="bodyMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1232" height="1280"><rect width="1232" height="1280" fill="white"/><use href="#leftShape" fill="black"/><use href="#rightShape" fill="black"/></mask>
</defs></svg>
<section id="menu" class="screen" aria-label="Настройка слогов"><div class="menu-card panel"><div class="eyebrow">Маленькое ночное приключение</div><h1>Лови светлячков</h1><p class="sub">Выбери буквы — и отправляйся за светом</p><div class="settings"><section class="group"><div class="group-head"><h3>Согласные</h3><span class="limit" id="consonant-count"></span></div><div class="letters" id="consonants" aria-label="Выбери до четырёх согласных"></div></section><section class="group"><div class="group-head"><h3>Гласные</h3><span class="limit" id="vowel-count"></span></div><div class="letters" id="vowels" aria-label="Выбери до четырёх гласных"></div></section></div><p class="preview-label" id="preview-label"></p><div class="syllables" id="syllables"></div><p class="message" id="message" role="status" aria-live="polite"></p><button id="play" class="primary">Играть</button></div></section>
<section id="playfield" class="screen" hidden aria-label="Поляна со светлячками"><div class="hud"><div class="hud-title">Лови светлячков</div><div class="hud-center"><p class="progress" id="progress" role="status" aria-live="polite"></p><div class="track"><span id="progress-bar"></span></div></div><button id="back" class="ghost">Изменить слоги</button></div><p class="instruction" id="instruction">Прочитай слог и поймай светлячка</p><div id="bugs"></div><div class="jar-area" id="jar-area"><div id="jar-glow" class="jar-glow"></div><div id="jar-lights" class="jar-lights"></div><img class="jar" src="jar.png" alt=""><img class="lid" src="lid.png" alt=""></div></section>
<section id="ending" class="screen" hidden aria-label="Раунд завершён"><div class="end-card panel"><div class="eyebrow">Поляна сияет благодаря тебе</div><h2>Отлично!</h2><p class="sub">Все светлячки собраны!</p><div class="end-actions"><button id="again" class="primary">Играть ещё</button><button id="change" class="ghost">Изменить слоги</button></div></div></section><p id="asset-error" hidden role="alert"></p>
</main></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id), C=['М','Н','П','Б','Т','Д','К','Г','Ф','В','С','З','Л','Р','Х'], V=['А','О','У','Ы','И','Э','Я','Е','Ё','Ю'];
const selectedC=new Set(['М','Н','С','Л']),selectedV=new Set(['А','О','У','И']);
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,asset='firefly-assets%202/firefly.png';
let mode='menu',queue=[],total=0,caught=0,active=[],timers=new Set(),raf=0,lastTime=0,clock=0,round=0;
function fit(){const scale=Math.min(innerWidth/1920,innerHeight/1080);$('frame').style.width=1920*scale+'px';$('frame').style.height=1080*scale+'px';$('game').style.transform=`scale(${scale})`}addEventListener('resize',fit);fit();
function pairs(){return C.filter(x=>selectedC.has(x)).flatMap(c=>V.filter(x=>selectedV.has(x)).map(v=>c+v))}
function refresh(message=''){for(const [id,set] of [['consonants',selectedC],['vowels',selectedV]])for(const b of $(id).children)b.setAttribute('aria-pressed',set.has(b.textContent));$('consonant-count').textContent=selectedC.size+' из 4';$('vowel-count').textContent=selectedV.size+' из 4';const p=pairs();$('preview-label').textContent=p.length?`Слоги этого раунда · ${p.length}`:'Выбери хотя бы одну согласную и одну гласную';$('syllables').replaceChildren(...p.map(s=>{const e=document.createElement('span');e.className='chip';e.textContent=s;return e}));$('play').disabled=!p.length;$('message').textContent=message}
function letters(id,list,set){for(const letter of list){const b=document.createElement('button');b.className='letter';b.textContent=letter;b.onclick=()=>{if(set.has(letter))set.delete(letter);else if(set.size<4)set.add(letter);else{return refresh('Можно выбрать до 4 букв. Сними выделение с одной, чтобы выбрать другую.')}refresh()};$(id).append(b)}}letters('consonants',C,selectedC);letters('vowels',V,selectedV);refresh();
function later(fn,ms){const token=round,id=setTimeout(()=>{timers.delete(id);if(token===round)fn()},ms);timers.add(id)}
function clean(){round++;for(const id of timers)clearTimeout(id);timers.clear();cancelAnimationFrame(raf);active=[];$('bugs').replaceChildren();document.querySelectorAll('.particle').forEach(e=>e.remove())}
function shuffle(list){for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]]}return list}
function sprite(s){return `<svg viewBox="-55 -25 1342 1330" aria-hidden="true"><g class="wing-left"><image href="${asset}" width="1232" height="1280" clip-path="url(#leftClip)"/></g><g class="wing-right"><image href="${asset}" width="1232" height="1280" clip-path="url(#rightClip)"/></g><image href="${asset}" width="1232" height="1280" mask="url(#bodyMask)"/><text x="606" y="1025" text-anchor="middle">${s}</text></svg>`}
const slots=[{x:350,y:355},{x:755,y:475},{x:1160,y:330},{x:1560,y:485}];
function spawn(slot){if(!queue.length||mode!=='playing')return;const s=queue.shift(),e=document.createElement('button');e.className='bug';e.setAttribute('aria-label','Поймать слог '+s);e.innerHTML=sprite(s);const b={e,s,slot,phase:Math.random()*Math.PI*2,x:slots[slot].x,y:slots[slot].y,status:'flying'};e.onclick=()=>catchBug(b);$('bugs').append(e);active.push(b);position(b);}
function position(b){b.e.style.transform=`translate(${b.x-145}px,${b.y-153}px)`}
function animate(now){const delta=lastTime?Math.min(now-lastTime,50):0;lastTime=now;if(!document.hidden)clock+=delta;for(const b of active){if(b.status!=='flying')continue;const t=clock/1000,p=slots[b.slot];b.x=p.x+(reduced?0:Math.sin(t*.42+b.phase)*68);b.y=p.y+(reduced?0:Math.sin(t*.58+b.phase)*36);position(b)}if(mode==='playing')raf=requestAnimationFrame(animate)}
function updateProgress(){$('progress').textContent=`${caught} из ${total}`;$('progress-bar').style.width=(caught/total*100)+'%';$('jar-glow').style.opacity=String(.1+.8*caught/total)}
function spark(x,y,n=8){if(reduced)return;for(let i=0;i<n;i++){const e=document.createElement('i'),a=Math.random()*Math.PI*2,d=35+Math.random()*65;e.className='particle';e.style.cssText=`left:${x}px;top:${y}px;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px`;$('game').append(e);later(()=>e.remove(),850)}}
function catchBug(b){if(mode!=='playing'||b.status!=='flying')return;b.status='caught';b.e.disabled=true;b.e.classList.add('catching');spark(b.x,b.y+80);later(()=>{b.e.style.transition=`transform ${reduced?200:800}ms ease-in-out,opacity .8s`;b.e.style.transform='translate(815px,720px) scale(.11)';b.e.style.opacity='.35';later(()=>{b.e.remove();active=active.filter(x=>x!==b);caught++;const l=document.createElement('span');l.className='light';l.style.left=(77+((caught*47)%155))+'px';l.style.top=(117+((caught*31)%115))+'px';l.style.animationDelay=(-caught*.23)+'s';$('jar-lights').append(l);updateProgress();if(caught===total)finish();else spawn(b.slot)},reduced?220:820)},450)}
function start(){if(!pairs().length)return;clean();mode='playing';queue=shuffle(pairs());total=queue.length;caught=0;clock=0;lastTime=0;$('menu').hidden=true;$('ending').hidden=true;$('playfield').hidden=false;$('jar-area').className='jar-area';$('jar-lights').replaceChildren();$('instruction').textContent='Прочитай слог и поймай светлячка';$('back').disabled=false;updateProgress();for(let i=0;i<Math.min(4,total);i++)spawn(i);raf=requestAnimationFrame(animate);$('back').focus({preventScroll:true})}
function finish(){mode='finale';cancelAnimationFrame(raf);$('back').disabled=true;$('instruction').textContent='Пора отпустить светлячков на волю';$('jar-area').classList.add('closed');later(()=>{$('jar-area').classList.remove('closed');$('jar-area').classList.add('releasing');$('jar-lights').replaceChildren();spark(960,810,20);for(let i=0;i<total;i++){const e=document.createElement('div');e.className='bug';e.innerHTML=sprite('');e.style.transform='translate(815px,720px) scale(.13)';$('bugs').append(e);later(()=>{e.style.transition=`transform ${reduced?600:2400}ms ease-out, opacity 2.2s`;const angle=Math.PI+(i/(Math.max(1,total-1)))*Math.PI;const x=960+Math.cos(angle)*850,y=700+Math.sin(angle)*640;e.style.transform=`translate(${x-145}px,${y-153}px) scale(.4)`;e.style.opacity='0';later(()=>e.remove(),2500)},i*75)}later(()=>{mode='done';$('ending').hidden=false;$('again').focus({preventScroll:true})},total*75+2200)},1000)}
function menu(){clean();mode='menu';$('menu').hidden=false;$('playfield').hidden=true;$('ending').hidden=true;refresh();$('play').focus({preventScroll:true})}
$('play').onclick=start;$('again').onclick=start;$('back').onclick=menu;$('change').onclick=menu;
for(const src of ['fon.png','jar.png','lid.png',asset]){const img=new Image();img.onerror=()=>{$('asset-error').hidden=false;$('asset-error').textContent='Не удалось загрузить изображение: '+decodeURIComponent(src)+'. Проверь расположение файлов.'};img.src=src}
</script></body></html>
